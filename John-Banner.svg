<svg width="800" height="300" viewBox="0 0 800 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#161B22;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>

    <!-- Filtro Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes growBar {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1); }
      }
      @keyframes cursorBlink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-3px); }
      }
      @keyframes flowLine {
        from { stroke-dashoffset: 20; }
        to { stroke-dashoffset: 0; }
      }

      .code-text { font-family: 'Courier New', monospace; font-size: 12px; fill: #e6edf3; }
      .bar { transform-origin: bottom; animation: growBar 3s infinite ease-in-out; }
      .avatar-head { animation: float 4s infinite ease-in-out; }
    </style>
  </defs>

  <!-- FONDO -->
  <rect width="800" height="300" fill="url(#bgGradient)" rx="10"/>

  <!-- CONECTOR (Cable punteado entre ventanas) -->
  <line x1="310" y1="140" x2="370" y2="140" stroke="#30363d" stroke-width="2" stroke-dasharray="5,5">
    <animate attributeName="stroke-dashoffset" from="20" to="0" dur="1s" repeatCount="indefinite" />
  </line>

  <!-- === VENTANA IZQUIERDA (CÓDIGO) === -->
  <g transform="translate(40, 50)">
    <!-- Marco -->
    <rect width="270" height="170" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- Header -->
    <rect width="270" height="25" rx="6" fill="#161b22"/>
    <rect y="10" width="270" height="15" fill="#161b22"/> <!-- Parche visual -->
    <circle cx="15" cy="12" r="4" fill="#ff5f56"/>
    <circle cx="30" cy="12" r="4" fill="#ffbd2e"/>
    <circle cx="45" cy="12" r="4" fill="#27c93f"/>
    <text x="80" y="16" fill="#8b949e" font-family="sans-serif" font-size="10" font-weight="bold">mission_etl.py</text>

    <!-- Contenido Código -->
    <text x="15" y="50" class="code-text" fill="#ff7b72">def</text>
    <text x="45" y="50" class="code-text" fill="#d2a8ff">transform</text>
    <text x="115" y="50" class="code-text" fill="#e6edf3">(raw_data):</text>
    
    <text x="30" y="75" class="code-text" fill="#8b949e"># 1. Clean chaos</text>
    <text x="30" y="90" class="code-text">clean = data.fix()</text>

    <text x="30" y="115" class="code-text" fill="#8b949e"># 2. Add value</text>
    <text x="30" y="130" class="code-text">insight = model(clean)</text>

    <text x="30" y="155" class="code-text" fill="#ff7b72">return</text>
    <text x="80" y="155" class="code-text" fill="#a5d6ff">"Impact 🚀"</text>
    <rect x="155" y="145" width="2" height="12" fill="#38bdf8" style="animation: cursorBlink 1s infinite"/>
  </g>

  <!-- === VENTANA DERECHA (GRÁFICOS) === -->
  <g transform="translate(370, 50)">
    <!-- Marco -->
    <rect width="390" height="170" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- Header -->
    <line x1="0" y1="35" x2="390" y2="35" stroke="#30363d" stroke-width="1"/>
    <text x="20" y="24" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold" letter-spacing="1">LIVE METRICS // EFFICIENCY</text>

    <!-- Área de Gráficas -->
    <g transform="translate(30, 140)"> <!-- Base del gráfico -->
       <!-- Línea Base -->
       <line x1="0" y1="0" x2="330" y2="0" stroke="#30363d" stroke-width="1"/>
       
       <!-- Barras (Posición ajustada manualmente) -->
       <rect class="bar" x="20" y="-40" width="30" height="40" fill="url(#barGradient)" style="animation-duration: 2.5s"/>
       <rect class="bar" x="70" y="-70" width="30" height="70" fill="url(#barGradient)" style="animation-duration: 3.5s"/>
       <rect class="bar" x="120" y="-50" width="30" height="50" fill="url(#barGradient)" style="animation-duration: 2.8s"/>
       <rect class="bar" x="170" y="-90" width="30" height="90" fill="url(#barGradient)" filter="url(#glow)" style="animation-duration: 4s"/>
       <rect class="bar" x="220" y="-60" width="30" height="60" fill="url(#barGradient)" style="animation-duration: 3.2s"/>
       <rect class="bar" x="270" y="-80" width="30" height="80" fill="url(#barGradient)" style="animation-duration: 3s"/>
    </g>
  </g>

  <!-- === PERSONAJE (CENTRADO ABAJO) === -->
  <g transform="translate(340, 200)">
    <!-- Cuerpo -->
    <path d="M 10 100 C 10 60, 110 60, 110 100" fill="#1f2937"/>
    
    <!-- Cabeza Flotante -->
    <g class="avatar-head">
      <circle cx="60" cy="50" r="35" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
      <!-- Visor -->
      <path d="M 35 48 Q 60 65 85 48" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)">
        <animate attributeName="stroke" values="#38bdf8;#a5f3fc;#38bdf8" dur="3s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

</svg>